server:
  port: 8080

spring:
  application:
    name: social-network

  # =============================================
  # MSSQL DataSource
  # =============================================
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SocialMediaDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: '123'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  # =============================================
  # JPA / Hibernate
  # =============================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_schema: dbo
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # =============================================
  # Jackson (JSON serialization)
  # =============================================
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # =============================================
  # File Upload
  # =============================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# =============================================
# JWT
# =============================================
jwt:
  secret: '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970'
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

# =============================================
# Groq AI
# =============================================
groq:
  api:
    url: https://api.groq.com/openai/v1/chat/completions
    key: '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'
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.7
  bot:
    username: groq
    display-name: Groq AI
    system-prompt: >
      B\u1ea1n l\u00e0 Groq AI, tr\u1ee3 l\u00fd th\u00f4ng minh \u0111\u01b0\u1ee3c t\u00edch h\u1ee3p v\u00e0o m\u1ea1ng x\u00e3 h\u1ed9i.
      H\u00e3y tr\u1ea3 l\u1eddi ng\u1eafn g\u1ecdn, th\u00e2n thi\u1ec7n v\u00e0 h\u1eefu \u00edch b\u1eb1ng ng\u00f4n ng\u1eef ng\u01b0\u1eddi d\u00f9ng \u0111ang d\u00f9ng.
      \u0110\u00e2y l\u00e0 m\u1ea1ng x\u00e3 h\u1ed9i n\u00ean h\u00e3y ph\u1ea3n h\u1ed3i t\u1ef1 nhi\u00ean, kh\u00f4ng qu\u00e1 formal.
      Lu\u00f4n nh\u1edb context h\u1ed9i tho\u1ea1i tr\u01b0\u1edbc \u0111\u00f3 \u0111\u1ec3 tr\u1ea3 l\u1eddi ch\u00ednh x\u00e1c.

# =============================================
# File l\u01b0u tr\u1eef upload
# =============================================
file:
  upload-dir: ./uploads

# =============================================
# Logging
# =============================================
logging:
  level:
    com.socialapp: DEBUG
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE