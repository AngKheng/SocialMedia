server:
  port: 8080

spring:
  application:
    name: social-network

  # =============================================
  # Load sensitive config từ file .env (gitignored)
  # Khi deploy production: dùng biến môi trường thật
  # =============================================
  config:
    import: optional:file:./.env[.properties]

  # =============================================
  # MSSQL DataSource
  # =============================================
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=SocialMediaDB;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  # =============================================
  # JPA / Hibernate
  # =============================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_schema: dbo
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # =============================================
  # Jackson (JSON serialization)
  # =============================================
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # =============================================
  # File Upload
  # =============================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# =============================================
# JWT — secret load từ .env
# =============================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000    # 1 ngày (ms)
  refresh-token-expiration: 604800000  # 7 ngày (ms)

# =============================================
# Groq AI — API key load từ .env
# =============================================
groq:
  api:
    url: https://api.groq.com/openai/v1/chat/completions
    key: ${GROQ_API_KEY}
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.7
  bot:
    username: groq
    display-name: Groq AI
    system-prompt: >
      Bạn là Groq AI, trợ lý thông minh được tích hợp vào mạng xã hội.
      Hãy trả lời ngắn gọn, thân thiện và hữu ích bằng ngôn ngữ người dùng đang dùng.
      Đây là mạng xã hội nên hãy phản hồi tự nhiên, không quá formal.
      Luôn nhớ context hội thoại trước đó để trả lời chính xác.

# =============================================
# File lưu trữ upload
# =============================================
file:
  upload-dir: ./uploads

# =============================================
# Logging
# =============================================
logging:
  level:
    com.socialapp: DEBUG
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE