server:
  port: 8080

spring:
  application:
    name: social-network

  # ===== MSSQL Database =====
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=social_network_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: YourPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: update          # T\u1ef1 \u0111\u1ed9ng t\u1ea1o/c\u1eadp nh\u1eadt schema t\u1eeb Entity
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_schema: dbo

  # ===== Jackson =====
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

# ===== JWT Configuration =====
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970  # 64-char hex secret
  access-token-expiration: 86400000      # 24 gi\u1edd (ms)
  refresh-token-expiration: 604800000    # 7 ng\u00e0y (ms)

# ===== Groq AI Configuration =====
groq:
  api:
    url: https://api.groq.com/openai/v1/chat/completions
    key: YOUR_GROQ_API_KEY_HERE           # Thay b\u1eb1ng API key th\u1ef1c c\u1ee7a b\u1ea1n
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.7
  bot:
    username: groq                         # T\u00ean bot tr\u00ean h\u1ec7 th\u1ed1ng
    display-name: Groq AI
    system-prompt: >
      B\u1ea1n l\u00e0 Groq AI, m\u1ed9t tr\u1ee3 l\u00fd th\u00f4ng minh \u0111\u01b0\u1ee3c t\u00edch h\u1ee3p v\u00e0o m\u1ea1ng x\u00e3 h\u1ed9i.
      H\u00e3y tr\u1ea3 l\u1eddi ng\u1eafn g\u1ecdn, th\u00e2n thi\u1ec7n v\u00e0 h\u1eefu \u00edch.
      B\u1ea1n \u0111ang trong m\u1ed9t cu\u1ed9c tr\u00f2 chuy\u1ec7n tr\u00ean m\u1ea1ng x\u00e3 h\u1ed9i, h\u00e3y ph\u1ea3n h\u1ed3i t\u1ef1 nhi\u00ean nh\u01b0 m\u1ed9t ng\u01b0\u1eddi d\u00f9ng.
      Gi\u1eef context c\u1ee7a cu\u1ed9c tr\u00f2 chuy\u1ec7n \u0111\u1ec3 tr\u1ea3 l\u1eddi ch\u00ednh x\u00e1c.

# ===== File Upload =====
file:
  upload-dir: ./uploads
  max-size: 10MB

# ===== Logging =====
logging:
  level:
    com.socialapp: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG