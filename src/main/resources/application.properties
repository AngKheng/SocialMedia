server:
  port: 8080

spring:
  application:
    name: social-network

  # =============================================
  # MSSQL DataSource
  # =============================================
  datasource:
    # S\u1eeda localhost:1433 th\u00e0nh host th\u1ef1c n\u1ebfu c\u1ea7n
    # S\u1eeda social_network_db th\u00e0nh t\u00ean database c\u1ee7a b\u1ea1n
    url: jdbc:sqlserver://localhost:1433;databaseName=social_network_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: YourPassword123!        # \u2190 \u0110\u1ed4I th\u00e0nh m\u1eadt kh\u1ea9u MSSQL c\u1ee7a b\u1ea1n
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # Connection pool (HikariCP m\u1eb7c \u0111\u1ecbnh c\u1ee7a Spring Boot)
    hikari:
      connection-timeout: 30000       # 30 gi\u00e2y
      maximum-pool-size: 10
      minimum-idle: 2

  # =============================================
  # JPA / Hibernate
  # =============================================
  jpa:
    hibernate:
      # update  \u2192 t\u1ef1 \u0111\u1ed9ng t\u1ea1o/c\u1eadp nh\u1eadt b\u1ea3ng t\u1eeb Entity (d\u00f9ng khi dev)
      # validate \u2192 ch\u1ec9 ki\u1ec3m tra, kh\u00f4ng t\u1ea1o b\u1ea3ng (d\u00f9ng khi production)
      ddl-auto: update
    show-sql: true
    open-in-view: false               # T\u1eaft OSIV \u0111\u1ec3 tr\u00e1nh lazy-load ngo\u00e0i transaction
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_schema: dbo
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # =============================================
  # Jackson (JSON serialization)
  # =============================================
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null  # B\u1ecf field null kh\u1ecfi response

  # =============================================
  # File Upload
  # =============================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# =============================================
# JWT
# =============================================
jwt:
  # Secret d\u1ea1ng Base64 (64 k\u00fd t\u1ef1 hex).
  # T\u1ea1o secret m\u1edbi: openssl rand -hex 32
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000    # 24 gi\u1edd (ms)
  refresh-token-expiration: 604800000  # 7 ng\u00e0y (ms)

# =============================================
# Groq AI
# =============================================
groq:
  api:
    url: https://api.groq.com/openai/v1/chat/completions
    key: YOUR_GROQ_API_KEY_HERE        # \u2190 \u0110\u1ed4I th\u00e0nh API key t\u1ea1i console.groq.com
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.7
  bot:
    username: groq
    display-name: Groq AI
    # System prompt g\u1eedi k\u00e8m m\u1ed7i l\u1ea7n g\u1ecdi Groq API
    system-prompt: >
      B\u1ea1n l\u00e0 Groq AI, tr\u1ee3 l\u00fd th\u00f4ng minh \u0111\u01b0\u1ee3c t\u00edch h\u1ee3p v\u00e0o m\u1ea1ng x\u00e3 h\u1ed9i.
      H\u00e3y tr\u1ea3 l\u1eddi ng\u1eafn g\u1ecdn, th\u00e2n thi\u1ec7n v\u00e0 h\u1eefu \u00edch b\u1eb1ng ng\u00f4n ng\u1eef ng\u01b0\u1eddi d\u00f9ng \u0111ang d\u00f9ng.
      \u0110\u00e2y l\u00e0 m\u1ea1ng x\u00e3 h\u1ed9i n\u00ean h\u00e3y ph\u1ea3n h\u1ed3i t\u1ef1 nhi\u00ean, kh\u00f4ng qu\u00e1 formal.
      Lu\u00f4n nh\u1edb context h\u1ed9i tho\u1ea1i tr\u01b0\u1edbc \u0111\u00f3 \u0111\u1ec3 tr\u1ea3 l\u1eddi ch\u00ednh x\u00e1c.

# =============================================
# File l\u01b0u tr\u1eef upload (avatar, \u1ea3nh b\u00e0i \u0111\u0103ng)
# =============================================
file:
  upload-dir: ./uploads

# =============================================
# Logging
# =============================================
logging:
  level:
    com.socialapp: DEBUG
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE